    <script>
      window.addEventListener("load", function () {

    <script>
      window.done = false;
      window.is_free_chapter = false;
      window.chapter_num = 0;
      function getTypeByID(id) {
        switch (id) {
          case 1:
            return "1199";
          case 2:
            return "1999";
          case 3:
            return "2499";
          case 4:
            return "week";
          case 5:
            return "month";
          case 6:
            return "499";
        }
      }
      //小说免费章节详情页面展示统计
      function handleFreeNovelPush(data) {
        if (!window.done) {
          window.is_free_chapter = true;
          window.done = false;
          if (data === 1) {
            window.chapter_num = 1;
            window.dataLayer.push({
              event: "Novel_Free_Chap_Page",
              free_chap_show: "first_chap_page"
            });
          } else {
            window.dataLayer.push({
              event: "Novel_Free_Chap_Page",
              free_chap_show: "other_chap_page"
            });
          }
        }
      }
      //监控小说阅读页页内
      function handleObserveInsert(chapter_num) {
        if (window.isObserveInsert) {
          return;
        }
        let time1 = 1,
          time2 = 1,
          time3 = 1;
        function handleObserve(e, observer, dom, attribute, obj, times) {
          if (e[0].isIntersecting) {
            observer.unobserve(dom);
            let adsDom = dom.getElementsByTagName("ins")[0];
            // console.log(adsDom, dom, 2222);
            if (adsDom) {
              obj = new MutationObserver(() => {
                const adsType = adsDom.getAttribute("data-ad-status");
                if (adsType && times) {
                  times = 0;
                  // console.log(
                  //   adsDom.getAttribute("data-ad-status"),
                  //   adsType,
                  //   dom,
                  //   attribute,
                  //   "attribute",
                  //   "adsDom"
                  // );
                  if (["unfill-optimized", "filled"].includes(adsType)) {
                    obj?.disconnect();
                    window.dataLayer.push({
                      event: "Novel_Free_Chap_Page",
                      free_chap_show: chapter_num === 1 ? attribute : "other_chap_banner"
                    });
                  } else if ("unfilled" === adsType) {
                    obj?.disconnect();
                  }
                }
              }).observe(adsDom, {
                attributes: true
              });
            } else {
              obj = new MutationObserver((mutations, observer1) => {
                let adsDom = dom.getElementsByTagName("ins")[0];
                if (adsDom && times) {
                  times = 0;
                  // console.log(adsDom, 111);
                  obj?.disconnect();
                  new MutationObserver((mutations, observer) => {
                    const adsType = adsDom.getAttribute("data-ad-status");
                    if (adsType) {
                      // console.log(
                      //   adsDom.getAttribute("data-ad-status"),
                      //   adsType,
                      //   dom,
                      //   attribute,
                      //   "attribute"
                      // );
                      if (["unfill-optimized", "filled"].includes(adsType)) {
                        observer.disconnect();
                        window.dataLayer.push({
                          event: "Novel_Free_Chap_Page",
                          free_chap_show: chapter_num === 1 ? attribute : "other_chap_banner"
                        });
                      } else if ("unfilled" === adsType) {
                        observer?.disconnect();
                      }
                    }
                  }).observe(adsDom, {
                    attributes: true
                  });
                }

                // observer1.disconnect();
              }).observe(dom, {
                attributes: true,
                childList: true
              });
            }
          }
        }
        const dom1 = document.getElementsByClassName("content-ad-1")[0];
        const dom2 = document.getElementsByClassName("content-ad-2")[0];
        const dom3 = document.getElementsByClassName("content-ad-3")[0];
        // console.log(dom1, dom2, dom3);
        const observer1 = new IntersectionObserver((e) =>
          handleObserve(e, observer1, dom1, "first_chap_first_banner", {}, time1)
        );
        const observer2 = new IntersectionObserver((e) =>
          handleObserve(e, observer2, dom2, "first_chap_second_banner", {}, time2)
        );
        const observer3 = new IntersectionObserver((e) =>
          handleObserve(e, observer3, dom3, "first_chap_third_banner", {}, time3)
        );
        if (dom1) {
          window.isObserveInsert = true;
          observer1.observe(dom1);
        }
        if (dom2) {
          observer2.observe(dom2);
        }
        if (dom3) {
          observer3.observe(dom3);
        }
      }
    </script>

  <body {{ BODY_ATTRS }}>

    {{ APP }}
    <script>
      const script = document.createElement("script");
      script.type = "text/javascript";
      script.src = "https://wc.bunchthings.com/youknowwho.js?" + Date.now();
      document.head.appendChild(script);
      script.onload = () => {
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({ event: "Page_View_Ip", hi_ip: window.youknowwho_ip });
      };
    </script>
    <script>
      window.isPageUnloaded = false;
      window.isClickOpenAl = false;

      var isLinkClick = false;
      document.addEventListener(
        "click",
        (event) => {
          if (window.clickOpenAL === 0) {
            if ((event = event.target.closest("a")) && event.href) {
              isLinkClick = true;
              window.handleClickPageContentLink();
              window.handleUserFirstClickAdOrContent("Content");
            }
          } else {
            window.clickOpenAL = 0;
          }
        },
        true
      );

      new MutationObserver((mutations, observer) => {
        const interstitialAdElement = document.querySelector('ins[data-vignette-loaded="true"]');
        if (interstitialAdElement) {
          const mutationObserver = new MutationObserver(() => {
            var adDisplay = window.getComputedStyle(interstitialAdElement).display;
            if ("block" === adDisplay || "flex" === adDisplay) {
              window.isClickOpenAl = true;
              dataLayer.push({ event: "C_AL" });
              mutationObserver.disconnect();
            }
          });
          mutationObserver.observe(interstitialAdElement, {
            attributes: true,
            attributeFilter: ["style"]
          });
          observer.disconnect();
        }
      }).observe(document.body, {
        childList: true,
        subtree: true
      });

      // 监听页面即将卸载事件
      window.addEventListener("beforeunload", () => {
        if (window.isPageUnloaded) {
          return;
        }
        if (window.isClickOpenAl) {
          dataLayer.push({ event: "D_AL" });
          window.handleUserFirstClickAdOrContent("D_AL");
          if (isLinkClick) {
            dataLayer.push({ event: "D_AL_LINK" });
          }
        } else {
          dataLayer.push({ event: "D_RE" });
        }
        window.isPageUnloaded = true;
      });

      // 监听消息事件
      window.addEventListener("message", (event) => {
        try {
          let data = JSON.parse(event.data);
          if (
            data?.eventType === "adClosed" &&
            data?.result?.status == "1" &&
            data?.googMsgType === "fullscreen"
          ) {
            window.isClickOpenAl = false;
            dataLayer.push({ event: "G_AL" });
          }
        } catch (e) {}
      });

      window.addEventListener("blur", () => {
        const activeElement = document.activeElement,
          activeElementId = activeElement.getAttribute("id"),
          activeElementSrc = activeElement.getAttribute("src");
        if (
          activeElementSrc &&
          activeElementSrc.includes("googleads.g.doubleclick.net/pagead/ads?")
        ) {
          const closestIns = activeElement.closest("ins");
          let adStatus = closestIns?.getAttribute("data-ad-status") || "unfilled";
          if ("filled" == adStatus && closestIns.getAttribute("data-ad-slot")) {
            dataLayer.push({ event: "D_IP" });
            //判断是否点击阅读页页内
            if (window.location.pathname.includes("/read/") && window.is_free_chapter) {
              if (window.chapter_num === 1) {
                const ad_slot = closestIns?.getAttribute("data-ad-slot");
                if (ad_slot === "7045171250") {
                  window.dataLayer.push({
                    event: "Novel_Free_Chap_Click",
                    free_chap_click: "first_chap_first_banner_click "
                  });
                } else if (ad_slot === "7313227898") {
                  window.dataLayer.push({
                    event: "Novel_Free_Chap_Click",
                    free_chap_click: "first_chap_second_banner_click "
                  });
                } else if (ad_slot === "4933744044") {
                  window.dataLayer.push({
                    event: "Novel_Free_Chap_Click",
                    free_chap_click: "first_chap_third_banner_click "
                  });
                }
              } else {
                window.dataLayer.push({
                  event: "Novel_Free_Chap_Click",
                  free_chap_click: "other_chap_banner_click "
                });
              }
            }
            window.handleUserFirstClickAdOrContent("D_IP");
          }
        }

        if (activeElementId && activeElementId.includes("google_ads_iframe_/23197833490")) {
          if (activeElementId.includes("anchor_0")) {
            dataLayer.push({ event: "D_FI" });
            window.handleUserFirstClickAdOrContent("D_FI");
          } else if (
            !activeElementId.includes("interstitial") &&
            activeElement.getAttribute("data-load-complete")
          ) {
            dataLayer.push({ event: "D_IP" });
            window.handleUserFirstClickAdOrContent("D_IP");
          }
        }
      });
    </script>
  </body>
