<!DOCTYPE html>
<html lang="en">
  <head {{ HEAD_ATTRS }}>
    <meta charset="UTF-8" />
    <script src="/commonsEvent.js"></script>

    <!-- FaceBook Pixel Code -->
    <script>
      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = !0;
        n.version = "2.0";
        n.queue = [];
        t = b.createElement(e);
        t.async = !0;
        t.src = v;
        s = b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t, s);
      })(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
      fbq("init", "1875563969657075");
      fbq("track", "PageView");
    </script>
    <!-- End FaceBook Pixel Code -->

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YHEGG7L6EF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-YHEGG7L6EF");
    </script>
    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-KDDGDX4P");
    </script>
    <!-- End Google Tag Manager -->

    <link rel="preload" href="https://securepubads.g.doubleclick.net/tag/js/gpt.js" as="script" />
    <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>
    <script>
      window.googletag = window.googletag || { cmd: [] };
      googletag.cmd.push(function () {
        googletag.pubads().addEventListener("slotRenderEnded", (event) => {
          // 页内填充了广告
          if (!event.isEmpty) {
            window.setUserPageAdActionData("show");
          }
        });
      });
    </script>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1853000876464912"
      crossorigin="anonymous"
    ></script>

    {{ HEAD }}
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in window.navigator) {
          window.navigator.serviceWorker
            .register("/sw.js")
            .then(() => {})
            .catch(() => {});
        }
        window.addEventListener("beforeinstallprompt", (e) => {
          e.preventDefault();
          window.deferredPrompt = e;
        });
      });
    </script>
  </head>
  <body {{ BODY_ATTRS }}>
    <!-- FaceBook pixel code -->
    <noscript
      ><img
        height="1"
        width="1"
        style="display: none"
        src="https://www.facebook.com/tr?id=1875563969657075&ev=PageView&noscript=1"
      />
    </noscript>
    <!-- End Facebook Pixel Code -->

    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-KDDGDX4P"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    {{ APP }}
    <script>
      const script = document.createElement("script");
      script.type = "text/javascript";
      script.src = "https://wc.bunchthings.com/youknowwho.js?" + Date.now();
      document.body.appendChild(script);
      script.onload = () => {
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
          event: "Page_View_Ip",
          hi_ip: window.youknowwho_ip || "unknown",
          hi_country: window.youknowwho_ip_country || "unknown"
        });
      };
    </script>
    <script>
      window.addEventListener("DOMContentLoaded", function () {
        // Dom加载完开始计时
        window.setUserStayThreeMinutes();
      });

      window.addEventListener("blur", () => {
        const activeElement = document.activeElement,
          activeElementId = activeElement.getAttribute("id");
        if (activeElementId && activeElementId.includes("google_ads_iframe_/23197833490")) {
          if (
            !activeElementId.includes("anchor_0") &&
            !activeElementId.includes("interstitial") &&
            activeElement.getAttribute("data-load-complete")
          ) {
            dataLayer.push({ event: "D_IP" });
            window.setUserFirstAction("click_y");
            window.setUserReadPageClickAction("click_y");
            window.setUserPageAdActionData("click");
          }
        }
      });
      window.addEventListener("visibilitychange", function () {
        if ("visible" === document.visibilityState) {
          setTimeout(() => {
            window.focus();
          }, 0);
        }
      });
    </script>
  </body>
</html>
