<!DOCTYPE html>
<html lang="en">
  <head {{ HEAD_ATTRS }}>
    <meta charset="UTF-8" />
    <script src="/trackEvent.js" type="text/javascript"></script>
    <script src="/commonsEvent.js" type="text/javascript"></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YHEGG7L6EF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-YHEGG7L6EF");
    </script>
    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-KDDGDX4P");
    </script>
    <!-- End Google Tag Manager -->

    <link rel="preload" href="https://securepubads.g.doubleclick.net/tag/js/gpt.js" as="script" />
    <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>
    <script>
      window.googletag = window.googletag || { cmd: [] };
      googletag.cmd.push(function () {
        googletag.pubads().addEventListener("slotRenderEnded", (event) => {
          const elementId = event.slot.getSlotId().getDomId();
          const userWatchPageAdIndex = elementId.split("_")[1];
          window.setUserWatchFirstTwoPageAd(Number(userWatchPageAdIndex) + 1);
          // 页内填充了广告
          if (!event.isEmpty) {
            window.setUserPageAdActionData("show");
            window.setUserPageAdActionToFaceBookData("show");
          }
        });
      });
    </script>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1853000876464912"
      crossorigin="anonymous"
    ></script>

    {{ HEAD }}
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in window.navigator) {
          window.navigator.serviceWorker
            .register("/sw.js")
            .then(() => {})
            .catch(() => {});
        }
        window.addEventListener("beforeinstallprompt", (e) => {
          e.preventDefault();
          window.deferredPrompt = e;
        });
      });
    </script>
  </head>
  <body {{ BODY_ATTRS }}>
    <!-- FaceBook pixel code -->
    <noscript
      ><img
        height="1"
        width="1"
        style="display: none"
        src="https://www.facebook.com/tr?id=1875563969657075&ev=PageView&noscript=1"
      />
    </noscript>
    <!-- End Facebook Pixel Code -->

    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-KDDGDX4P"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    {{ APP }}
    <script>
      const script = document.createElement("script");
      script.type = "text/javascript";
      script.src = "https://wc.bunchthings.com/youknowwho.js?" + Date.now();
      document.body.appendChild(script);
      script.onload = () => {
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
          event: "Page_View_Ip",
          hi_ip: window.youknowwho_ip || "unknown",
          hi_country: window.youknowwho_ip_country || "unknown"
        });
      };
    </script>
    <script>
      window.addEventListener("blur", () => {
        const activeElement = document.activeElement,
          activeElementId = activeElement.getAttribute("id");
        if (activeElementId && activeElementId.includes("charmnovels_detail")) {
          dataLayer.push({ event: "D_IP" });
          window.setUserFirstAction("click_y");
          window.setUserReadPageClickAction("click_y");
          window.setUserPageAdActionData("click");

          // 获取页内的下标
          const pageAdIndex = activeElementId.split("charmnovels_detail_")[1].split("_")[0];
          // 如果是首个章节，则第6个及以后的广告点击才上报
          if (!window.isFirstChapterNum || Number(pageAdIndex) >= 6) {
            window.setUserPageAdActionToFaceBookData(
              "click",
              `chapter_${window.currentReadChapterNum}_adIndex_${pageAdIndex}`
            );
          }
        }
      });
      window.addEventListener("visibilitychange", function () {
        if ("visible" === document.visibilityState) {
          setTimeout(() => {
            window.focus();
          }, 0);
        }
      });
    </script>
  </body>
</html>
