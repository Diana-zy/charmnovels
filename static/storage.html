<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="IE=edge" http-equiv="X-UA-Compatible" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <title>HTML PostMessage Listener</title>
  </head>
  <body>
    <h1>HTML PostMessage Listener</h1>
    <script>
      const currentDomain = window.location.host;
      let targetDomain = "";
      const domainPattern = /^(www[0-9]*|[0-9]*)\.?([^\.]+)\.([a-z]{2,})$/;
      const match = currentDomain.match(domainPattern);
      if (match) {
        const prefix = match[1];
        if (!prefix) {
          targetDomain = `www.${currentDomain}`;
        } else if (prefix.startsWith("www")) {
          if (prefix === "www") {
            targetDomain = currentDomain.substring(4);
          } else {
            targetDomain = currentDomain.substring(3);
          }
        } else {
          targetDomain = `www${currentDomain}`;
        }
      } else {
        targetDomain = currentDomain;
      }

      window.addEventListener("message", handleMessage);
      function handleMessage(e) {
        if (e.origin === `https://${targetDomain}`) {
          if (e.data.type === "send-localStorage-message") {
            localStorage.setItem(e.data.name, e.data.data);
          } else if (e.data.type === "send-sessionStorage-message") {
            sessionStorage.setItem(e.data.name, e.data.data);
          }
        }
        // if (e.origin === `http://192.168.101.20:3000`) {
        //   if (e.data.type === "send-localStorage-message") {
        //     localStorage.setItem(e.data.name, e.data.data);
        //   } else if (e.data.type === "send-sessionStorage-message") {
        //     sessionStorage.setItem(e.data.name, e.data.data);
        //   }
        // }
      }
    </script>
  </body>
</html>
